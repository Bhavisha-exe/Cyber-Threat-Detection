<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Threat Detection</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#0f172a,#1e3a8a,#0f766e);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
        }

        .container{
            width:700px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(10px);
            border-radius:20px;
            padding:40px;
            text-align:center;
            box-shadow:0px 10px 30px rgba(0,0,0,0.4);
        }

        h1{
            font-size:36px;
            margin-bottom:20px;
        }

        p{
            font-size:18px;
            line-height:28px;
            margin-bottom:30px;
        }

        .btn{
            background:#00d4ff;
            color:black;
            border:none;
            padding:15px 35px;
            font-size:18px;
            border-radius:10px;
            cursor:pointer;
            transition:0.3s;
        }

        .btn:hover{
            background:white;
            transform:scale(1.05);
        }

        footer{
            margin-top:35px;
            font-size:14px;
            opacity:0.8;
        }
    </style>

</head>

<body>

<div class="container">

    <h1>🛡 Cyber Threat Detection System</h1>

    <p>
        This Machine Learning project analyzes network traffic
        and predicts whether the activity is <b>Normal</b>
        or an <b>Attack</b>.
    </p>

   <form action="/predict" method="POST">

    <input type="text"
           name="protocol"
           placeholder="Protocol (Example: tcp)"
           required>

    <br><br>

    <input type="text"
           name="service"
           placeholder="Service (Example: http)"
           required>

    <br><br>

    <input type="text"
           name="flag"
           placeholder="Flag (Example: SF)"
           required>

    <br><br>

    <button class="btn" type="submit">
        Predict Threat
    </button>

</form>
{% if prediction %}

<h2 style="margin-top:30px; color:#00ff99;">
    {{ prediction }}
</h2>

{% endif %}

    <footer>
        Developed using Python, Flask & Machine Learning
    </footer>

</div>

</body>
</html>
